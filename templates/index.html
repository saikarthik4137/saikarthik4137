<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sri Annamalaiyar Jewels - Gold Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2 class="text-center my-4">💎 Sri Annamalaiyar Jewels - Trichy 💎</h2>
    <form method="POST" class="card p-4 shadow">
      <div class="mb-3">
        <label class="form-label">Gold Weight (g):</label>
        <input type="number" step="0.01" name="weight" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Wastage Percentage (%):</label>
        <input type="number" step="0.01" name="wastage" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Today Gold Rate (₹/gram):</label>
        <input type="number" step="0.01" name="rate" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-warning w-100">Calculate</button>
    </form>

    {% if result %}
      <div class="mt-4 result-box">
        {% if result.error %}
          <p class="text-danger">{{ result.error }}</p>
        {% else %}
          <p>📏 Wastage: <strong>{{ result.wastage_grams }} g</strong></p>
          <p>⚖️ Total Weight: <strong>{{ result.total_weight }} g</strong></p>
          <p>💰 Total Price: <strong>₹{{ result.total_price }}</strong></p>
        {% endif %}
      </div>
    {% endif %}
  </div>
</body>
</html>
