<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gold & Silver Poster Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 🔧 Mobile scaling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('{{ url_for("static", filename="wip/poster-bg.jpg") }}');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }

        .form-container {
            max-width: 500px;
            margin: auto;
        }

        @media (max-width: 576px) {
            h2 {
                font-size: 1.4rem;
            }
            .form-container {
                padding: 1rem !important;
            }
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4 text-center fw-bold">Sri Annamalaiyar Jewels Manufacturers - Rate Poster Generator</h2>
    <div class="form-container border border-3 rounded p-4 bg-white shadow">
        <form method="post">
            <div class="mb-3">
                <label for="gold" class="form-label fw-bold">Today Gold 22 CT Rate (₹)</label>
                <input type="text" class="form-control" id="gold" name="gold" required>
            </div>
            <div class="mb-3">
                <label for="silver" class="form-label fw-bold">Today Silver Rate (₹)</label>
                <input type="text" class="form-control" id="silver" name="silver" required>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Generate Poster</button>
                <a href="/" class="btn btn-secondary">← Back to Calculator</a>
            </div>
        </form>
    </div>

    {% if image_path %}
    <div class="mt-4 text-center">
        <h5 class="fw-bold">Generated Poster:</h5>
        <img src="{{ url_for('static', filename=image_path.split('/')[-1]) }}" class="img-fluid border rounded shadow" style="max-width: 100%; height: auto; aspect-ratio: 9/16;">
        <p><a href="{{ url_for('download', filename=image_path.split('/')[-1]) }}" class="btn btn-success mt-2">📥 Download</a></p>
    </div>
    {% endif %}
</div>
</body>
</html>
