version: 2

models:
  - name: stg_sales_clean
    description: "Cleaned sales data after validation and filtering"

    columns:

      - name: id
        description: "Unique customer/order identifier"
        tests:
          - not_null

      - name: name
        description: "Customer name"
        tests:
          - not_null

      - name: item_id
        description: "Nested item identifier"
        tests:
          - not_null

      - name: amount
        description: "Transaction amount"
        tests:
          - not_null

      - name: price
        description: "Item price"
        tests:
          - not_null

      - name: total_value
        description: "Calculated total value"
        tests:
          - not_null